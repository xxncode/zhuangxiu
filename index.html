<!doctype html>
<html lang="zh-CN"><head>
<title>昆山新家装修参考</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 版式：首页 = 进度 + 最要紧横滑 + 阶段方块；阶段页 = 骨架目录 + 按分支排图卡、文字卡、待收集；点卡片弹出「文章说 / 要注意 / 依据」 */
:root{
  --bg:#FAF8F3; --card:#FFFFFF; --ink:#2B2723; --muted:#7A7068; --line:#ECE5DB;
  --accent:#D97757; --accent-ink:#B4532F; --accent-soft:#FBEBE2;
  --good:#3F8A5A; --good-soft:#E6F3EA; --warn:#A86A12; --warn-soft:#FCF0D9;
  --bad:#BC4A33; --bad-soft:#FBE4DE; --pref:#6F665E; --pref-soft:#EFEAE3;
  --shadow:0 1px 2px rgba(80,50,20,.06),0 6px 18px rgba(80,50,20,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
}
/* 只做暖白一种配色（他点名要白橙），不跟随深色模式 */
:root{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--serif);margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:30px;font-weight:800} h2{font-size:21px;font-weight:800} h3{font-size:18px;font-weight:800}
p{margin:0} button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.hero{display:flex;flex-direction:column;gap:14px}
.sub{color:var(--muted);font-size:14px}
.steps{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--muted);min-width:48px}
.step i{display:block;width:100%;height:6px;border-radius:3px;background:var(--line)}
.step.now{color:var(--accent-ink);font-weight:700}.step.now i{background:var(--accent)}

.urgent{background:var(--accent-soft);border-radius:20px;padding:20px 0 20px 18px;display:flex;flex-direction:column;gap:14px}
.urgent-head{display:flex;flex-direction:column;gap:4px;padding-right:18px}
.urgent-head .k{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--accent-ink)}
.urgent-head p{font-size:14px;color:var(--muted)}
.strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-right:18px;padding-bottom:4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.mini{flex:0 0 150px;scroll-snap-align:start;border:0;padding:0;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;text-align:left;display:flex;flex-direction:column}
.mini img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.mini span{padding:8px 10px 10px;font-size:14px;font-weight:600;line-height:1.4}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-head small{color:var(--muted);font-size:13px}
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:12px}
.stage{position:relative;border:0;padding:0;border-radius:16px;overflow:hidden;cursor:pointer;background:var(--card);box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column}
.stage img,.stage .ph{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.stage .ph{background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:30px;font-weight:800;color:var(--accent)}
.stage .t{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.stage b{font-family:var(--serif);font-size:18px}
.stage em{font-style:normal;font-size:13px;color:var(--muted)}
.badge{position:absolute;top:8px;left:8px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent);color:#fff}
.stage.avoid{background:var(--bad-soft)}.stage.avoid b{color:var(--bad)}

.back{align-self:flex-start;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px 6px 10px;cursor:pointer;font-size:14px;color:var(--accent-ink)}
.page-head{display:flex;flex-direction:column;gap:6px}
.page-head p{color:var(--muted);font-size:15px}

/* 骨架目录 */
.tree{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tree .lab{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.tree button{border:0;background:none;padding:7px 0;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;border-top:1px dashed var(--line)}
.tree button:first-of-type{border-top:0}
.num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tree .nm{flex:1;font-weight:600}
.tree .ct{font-size:13px;color:var(--muted)}
.tree .ct.gap{color:var(--warn)}

.branch{display:flex;flex-direction:column;gap:12px;scroll-margin-top:16px}
.bhead{display:flex;align-items:center;gap:10px}
.bdesc{color:var(--muted);font-size:14px;margin-top:-6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:12px}
.card{border:0;padding:0;background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;text-align:left;display:flex;flex-direction:column;position:relative}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.card .t{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.card b{font-size:15px;line-height:1.4}
.flash{position:absolute;top:8px;left:8px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent);color:#fff}
.tlist{display:flex;flex-direction:column;gap:8px}
.titem{border:0;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer}
.titem .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.titem b{font-size:15px}
.titem p{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.todo{border:1.5px dashed var(--line);border-radius:14px;padding:10px 14px;font-size:14px;color:var(--muted);display:flex;gap:8px}
.todo i{font-style:normal;flex:none}

.chip{align-self:flex-start;font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px;white-space:nowrap}
.good{background:var(--good-soft);color:var(--good)} .warn{background:var(--warn-soft);color:var(--warn)}
.bad{background:var(--bad-soft);color:var(--bad)} .pref{background:var(--pref-soft);color:var(--pref)}
.law{background:var(--accent-soft);color:var(--accent-ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:13px;color:var(--muted);align-items:center}
footer{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
footer a{color:var(--accent-ink)}

.sheet-bg{position:fixed;inset:0;background:rgba(30,20,10,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:20px}}
.sheet img{width:100%;aspect-ratio:6/5;object-fit:cover;display:block}
.sheet .body{padding:18px 20px 24px;display:flex;flex-direction:column;gap:12px}
.sheet h3{font-size:22px}
.sheet .tags{display:flex;gap:8px;flex-wrap:wrap}
.sheet .tags .chip{font-size:13px;padding:2px 10px}
.blk{display:flex;flex-direction:column;gap:2px}
.blk .lb{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.blk p{font-size:16px}
.blk.note{background:var(--bg);border-radius:12px;padding:10px 12px}
.blk.note .lb{color:var(--accent-ink)}
.sheet .src{font-size:13px;color:var(--muted)}
.close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);font-size:22px;line-height:1;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px)}to{transform:none}}}
</style>

挂墙还是放柜子、多大。文章给的参考：55 寸大约坐 1.9–3.1 m 远。", "law": ""}, {"id": "wifi", "s": "shuidian", "b": "guihua", "img": "wifi", "t": "全屋 WiFi 先布网线", "tag": "good", "key": 2, "src": [4, 8, 12], "say": "弱电箱做大；弱电箱到客厅布 3 根网线，到每个房间各 1 根；用超六类网线。", "note": "根数是文章的建议，按自家房间数调整。墙上的 WiFi 面板会发热，选大牌（[8] 说的）。", "law": ""}, {"id": "aircon", "s": "shuidian", "b": "guihua", "img": "aircon", "t": "空调先定类型", "tag": "good", "key": 1, "src": [4, 12], "say": "挂机、柜机、风管机还是中央空调先定；风管机和中央空调要配合吊顶，还要留冷凝水排水管。", "note": "出风口别对着床和沙发。", "law": ""}, {"id": "dishwasher", "s": "shuidian", "b": "guihua", "img": "dishwasher", "t": "洗碗机留水电", "tag": "good", "key": 1, "src": [2, 4, 12], "say": "放在水槽旁边，留进水、排水，插座留在隔壁柜。", "note": "先定嵌入式还是台式、多宽，柜子按机器尺寸做。", "law": ""}, {"id": "oven", "s": "shuidian", "b": "guihua", "img": "oven", "t": "蒸烤箱留专用电", "tag": "good", "key": 1, "src": [2, 4, 12], "say": "功率大，单独一路电；插座在上方或下方；柜子背后少做背板，方便散热。", "note": "先查机器要 10A 还是 16A 插座。", "law": ""}, {"id": "washer", "s": "shuidian", "b": "guihua", "img": "washer", "t": "洗衣机 + 烘干机", "tag": "good", "key": 1, "src": [2, 4, 12], "say": "先定叠放还是并排、上排水还是下排水，再留插座、上下水和地漏。", "note": "昆山梅雨季衣服难晾干，烘干机比较实用（推断）。想加一台洗内衣的小洗衣机，就一起留位置。", "law": ""}, {"id": "water", "s": "shuidian", "b": "guihua", "img": "water", "t": "净水和直饮机", "tag": "warn", "key": 1, "src": [2, 4, 12, 13], "say": "前置过滤、净水机、软水机、直饮机，选哪几样先定，水槽下留插座和水口。", "note": "装不装、装几样看预算和当地水质，不是必须（推断）。", "law": ""}, {"id": "toilet", "s": "shuidian", "b": "guihua", "img": "toilet", "t": "智能马桶留插座", "tag": "good", "key": 1, "src": [4, 12], "say": "马桶侧边离地约 30 cm 留一个防水插座。", "note": "壁挂马桶还要让水电工、瓦工、商家对齐尺寸。", "law": ""}, {"id": "towel", "s": "shuidian", "b": "guihua", "img": "towel", "t": "电热毛巾架留电", "tag": "warn", "key": 1, "src": [4, 12], "say": "卫生间墙上预留电源。", "note": "[4] 说要单独一路线；功率小的型号接卫生间插座回路也常见（推断），按产品说明来。", "law": ""}, {"id": "dock", "s": "shuidian", "b": "guihua", "img": "dock", "t": "扫地机留水电位", "tag": "warn", "key": 1, "src": [2, 4, 12], "say": "上下水款基站要留进水、排水和电源，高度要卡准。", "note": "先选好买哪款再留。也有人觉得扫地机拖不干净，见「先别照做」。", "law": ""}, {"id": "dengwei", "s": "shuidian", "b": "guihua", "img": null, "t": "灯位改到中间", "tag": "warn", "key": 0, "src": [9], "say": "开发商的灯位不居中就改：餐厅对着餐桌，卧室对着做完柜子以后的中间。", "note": "要先定家具位置。", "law": ""}, {"id": "circuit", "s": "shuidian", "b": "dianlu", "img": "circuit", "t": "大功率电器单独一路", "tag": "good", "key": 2, "src": [4, 9, 12], "say": "空调、蒸烤箱、电热水器各走一路电；大功率用 4 平方线，普通插座用 2.5 平方。", "note": "具体线径按电器功率，由电工设计。", "law": ""}, {"id": "loubao", "s": "shuidian", "b": "dianlu", "img": null, "t": "插座回路装漏电保护", "tag": "good", "key": 0, "src": [], "say": "除壁挂空调的插座外，插座回路都要装漏电保护；卫生间插座最好单独一路。", "note": "文章都没提，是我查规范补上的。电箱里看得到，验收时问电工。", "law": "住宅设计规范 GB 50096-2011 第 8.7.2 条"}, {"id": "wire-sep", "s": "shuidian", "b": "dianlu", "img": "wire-sep", "t": "强电弱电分开走", "tag": "good", "key": 1, "src": [4, 9], "say": "电线和网线不走同一个槽，隔开一段距离，交叉处垂直交叉。", "note": "文章说隔 30 cm。旧版布线规范（GB 50311-2007）对普通家用电线的要求大约是平行隔 13 cm，30 cm 更保守，做得到更好；新版的数字我没查到。锡箔纸见「先别照做」。", "law": ""}, {"id": "dengdianwei", "s": "shuidian", "b": "dianlu", "img": null, "t": "卫生间做等电位", "tag": "good", "key": 0, "src": [4], "say": "有洗浴设备的卫生间要做局部等电位，别为了好看封死。", "note": "规范要求的，关系到用电安全。", "law": "住宅设计规范 GB 50096-2011 第 8.7.2 条"}, {"id": "wallpipe", "s": "shuidian", "b": "jishui", "img": "wallpipe", "t": "洗脸盆下水走墙里", "tag": "good", "key": 2, "src": [2, 13], "say": "下水从墙里出，盆下面空着，好打扫。", "note": "要在水电时预埋，台盆和下水器要买墙排款；以后想改只能砸墙。", "law": ""}, {"id": "pipe-top", "s": "shuidian", "b": "jishui", "img": "pipe-top", "t": "水管走顶还是走地", "tag": "warn", "key": 2, "src": [4], "say": "[4] 说卫生间水管必须走顶：漏水能第一时间看到，修的时候不用砸砖。", "note": "走顶管子更长，热水要多等一会儿；冷水管要包保温防结露。走地只要打压合格、接头少也可以。两种都行，水电前定下来（推断）。", "law": ""}, {"id": "hotcold", "s": "shuidian", "b": "jishui", "img": "hotcold", "t": "冷热水口左热右冷", "tag": "good", "key": 0, "src": [4, 9, 13], "say": "两个出水口间距 15 cm，保持水平，左热右冷。", "note": "龙头和花洒装不上，多半是这里没做准。", "law": ""}, {"id": "valve", "s": "shuidian", "b": "jishui", "img": "valve", "t": "止逆阀先看有没有", "tag": "warn", "key": 1, "src": [11], "say": "[11] 说马桶进水、厨房烟道、卫生间排风口要装止逆阀，洗衣机换自动止水角阀。", "note": "住宅规范本来就要求公共烟道防倒灌（GB 50096 第 6.8.2 条），很多马桶进水阀也自带防倒流设计，先看家里有没有再买（推断）。烟道和排风口的要在吊顶前装。", "law": ""}, {"id": "geyin", "s": "shuidian", "b": "jishui", "img": null, "t": "下水管包隔音棉", "tag": "good", "key": 0, "src": [4, 6], "say": "下水管包隔音棉，挡楼上冲水的声音。", "note": "包管的材料和做法写进报价。", "law": ""}, {"id": "vslot", "s": "shuidian", "b": "gongyi", "img": "vslot", "t": "墙上尽量开竖槽", "tag": "good", "key": 0, "src": [4, 9, 13], "say": "尽量开竖槽；横槽要短（文章说非混凝土墙不超过 50 cm、混凝土墙不超过 30 cm），承重墙不乱开。", "note": "具体限制以物业和结构要求为准。", "law": ""}, {"id": "cailiao", "s": "shuidian", "b": "gongyi", "img": null, "t": "电线水管网线选对", "tag": "good", "key": 0, "src": [9, 4], "say": "电线用 BV 单股硬线，给水用 PPR 管，网线用超六类（标 CAT6A）。品牌型号写进合同。", "note": "", "law": ""}, {"id": "chuanxian", "s": "shuidian", "b": "gongyi", "img": null, "t": "线管别塞太满", "tag": "warn", "key": 0, "src": [9], "say": "一根线管里的线别太多，转弯做大弧度，以后才能换线。", "note": "文章说不超过管截面的 40%。", "law": ""}, {"id": "xianhe", "s": "shuidian", "b": "gongyi", "img": null, "t": "改完电盖线盒保护盖", "tag": "warn", "key": 0, "src": [9], "say": "防止后面贴砖刷墙时，水泥堵住线盒。", "note": "", "law": ""}, {"id": "pressure", "s": "shuidian", "b": "yanshou", "img": "pressure", "t": "水管打压测试", "tag": "good", "key": 2, "src": [4, 13], "say": "加压到 0.8–1.0 MPa，30 分钟不掉压就合格。", "note": "规范更严：塑料水管在试验压力（工作压力的 1.5 倍，不低于 0.6 MPa）下稳压 1 小时，压降不超过 0.05 MPa；再在 1.15 倍工作压力下稳压 2 小时，压降不超过 0.03 MPa。让师傅按规范做，拍压力表留证。", "law": "给排水验收规范 GB 50242-2002 第 4.2.1 条"}, {"id": "photo-check", "s": "shuidian", "b": "yanshou", "img": "photo-check", "t": "封槽前每面墙拍照", "tag": "good", "key": 2, "src": [13, 4], "say": "每面墙、地面、每个底盒（旁边放卷尺）都拍下来，再录一段走一圈的视频；完工要一份水电走向图。", "note": "几乎零成本，以后打孔、维修、扯皮都用得上。", "law": ""}, {"id": "tongdian", "s": "shuidian", "b": "yanshou", "img": null, "t": "通电和绝缘测试", "tag": "good", "key": 0, "src": [4], "say": "每个插座都通电测一遍、测绝缘，贴砖前做。", "note": "", "law": ""}, {"id": "bishui", "s": "niwa", "b": "fangshui", "img": "bishui", "t": "防水和闭水试验", "tag": "good", "key": 1, "src": [4, 6, 10], "say": "防水刷两遍，淋浴区刷到 1.8 m，闭水 48 小时，去楼下看漏不漏。", "note": <script>

  ${foot()}`;
}

function legend(){return `<div class="legend"><span><span class="chip good">推荐</span> 有规范或多篇支持、代价小</span><span><span class="chip warn">看情况</span> 有代价或前提</span><span><span class="chip pref">看喜好</span> 风格和习惯</span><span><span class="chip bad">不建议</span> 说法有问题</span></div>`}

function stagePage(id){
  const s=findStage(id); if(!s){location.hash="";return}
  const isAvoid=id==="avoid";
  const br=s.branches.map((b,k)=>({...b,k,items:byStage(id).filter(i=>i.b===b.id)}));
  app.innerHTML=`
  <button class="back" data-back>‹ 返回首页</button>
  <div class="page-head"><h1>${esc(s.name)}</h1><p>${esc(s.desc)}</p></div>
  ${isAvoid?"":`<nav class="tree" aria-label="这一阶段分几步"><span class="lab">这一阶段分 ${br.length} 步</span>
    ${br.map(b=>`<button data-go="b-${b.id}"><span class="num">${b.k+1}</span><span class="nm">${esc(b.name)}</span><span class="ct ${b.items.length?"":"gap"}">${b.items.length?b.items.length+" 条":"还没收集"}</span></button>`).join("")}</nav>`}
  ${br.map(b=>{
    const pics=b.items.filter(i=>i.img), txt=b.items.filter(i=>!i.img);
    return `<section class="branch" id="b-${b.id}">
      ${isAvoid?"":`<div class="bhead"><span class="num">${b.k+1}</span><h2>${esc(b.name)}</h2></div><p class="bdesc">${esc(b.desc)}</p>`}
      ${pics.length?`<div class="grid">${pics.map(i=>`<button class="card" data-i="${idx(i)}">${i.key?'<span class="flash">⚡ 水电前定</span>':""}<img src="${img(i.img)}" alt="" loading="lazy"><span class="t"><b>${esc(i.t)}</b><span class="chip ${i.tag}">${TAG[i.tag]}</span></span></button>`).join("")}</div>`:""}
      ${txt.length?`<div class="tlist">${txt.map(i=>`<button class="titem" data-i="${idx(i)}"><span class="row"><b>${esc(i.t)}</b><span class="chip ${i.tag}">${TAG[i.tag]}</span>${i.law?'<span class="chip law">规范</span>':""}</span><p>${esc(i.say)}</p></button>`).join("")}</div>`:""}
      ${(b.todo||[]).map(t=>`<div class="todo"><i>☐</i><span>${esc(t)}</span></div>`).join("")}
    </section>`}).join("")}
  ${legend()}
  ${foot()}`;
  window.scrollTo(0,0);
}

function foot(){
  return `<footer><p>内容整理自 ${Object.keys(SRC).length} 篇小红书和公众号，并对照国家规范核过关键数字：</p><p>${Object.values(SRC).map(x=>`<a href="${x.u}" target="_blank" rel="noopener">${esc(x.n)}</a>`).join("、")}</p><p>「推荐 / 看情况」是小年的判断，文章也会出错，具体做法以规范和施工师傅为准。</p></footer>`;
}

function open(n){
  const i=ITEMS[n];
  modal.hidden=false;
  modal.innerHTML=`<div class="sheet-bg" data-close><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(i.t)}">
    ${i.img?`<img src="${img(i.img)}" alt="">`:""}
    <div class="body">
      <div class="tags"><span class="chip ${i.tag}">${TAG[i.tag]}</span>${i.key?'<span class="chip law">⚡ 水电开工前要定</span>':""}</div>
      <h3>${esc(i.t)}</h3>
      <div class="blk"><span class="lb">${i.src.length?"文章说":"规范要求"}</span><p>${esc(i.say)}</p></div>
      ${i.note?`<div class="blk note"><span class="lb">要注意</span><p>${esc(i.note)}</p></div>`:""}
      <p class="src">${esc(evid(i))}${i.src.length?" · 来自 "+i.src.map(k=>esc(SRC[k].p+" · "+SRC[k].n)).join("、"):""}</p>
    </div></div>
    <button class="close" data-close aria-label="关闭">×</button></div>`;
  document.body.style.overflow="hidden";
  modal.querySelector(".close").focus();
}
function close(){modal.hidden=true;modal.innerHTML="";document.body.style.overflow=""}

document.addEventListener("click",e=>{
  const c=e.target.closest("[data-close]");
  if(c&&(e.target===c||c.classList.contains("close"))){close();return}
  const card=e.target.closest("[data-i]"); if(card){open(+card.dataset.i);return}
  const go=e.target.closest("[data-go]"); if(go){document.getElementById(go.dataset.go)?.scrollIntoView({behavior:"smooth"});return}
  const st=e.target.closest("[data-s]"); if(st){location.hash=st.dataset.s;return}
  if(e.target.closest("[data-back]")){location.hash="";}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!modal.hidden)close()});
function route(){close();const h=location.hash.slice(1);h?stagePage(h):home()}
window.addEventListener("hashchange",route);
route();
</script>

</body></html>
