<!doctype html>
<html lang="zh-CN"><head>
<title>昆山新家装修参考</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 版式：访达分栏（11/18 定）。最左一列 = 9 个阶段，分 3 大部分（准备 / 硬装 / 软装入住，每部分一个颜色）；
   点阶段 → 多一列「几步」（按施工先后排）；点步骤 → 多一列「条目」；点条目 → 右边大块看详情。越往深左边越窄，字还在。
   手机：一打开是首页（现在在哪一步 + 3 部分 9 个阶段），点进去再分栏。 */
:root{
  --bg:#FAF8F3; --card:#FFFFFF; --ink:#2B2723; --muted:#7A7068; --line:#ECE5DB; --sel:#FBEBE2;
  --accent:#D97757; --accent-ink:#B4532F; --accent-soft:#FBEBE2;
  --g1:#4E7D5B; --g1-soft:#E6F0E6;   /* 准备：绿 */
  --g2:#B4532F; --g2-soft:#FBEBE2;   /* 硬装：橙 */
  --g3:#4A6E8F; --g3-soft:#E4EDF5;   /* 软装入住：蓝 */
  --good:#3F8A5A; --good-soft:#E6F3EA; --warn:#A86A12; --warn-soft:#FCF0D9;
  --bad:#BC4A33; --bad-soft:#FBE4DE; --pref:#6F665E; --pref-soft:#EFEAE3;
  --shadow:0 1px 2px rgba(80,50,20,.06),0 4px 14px rgba(80,50,20,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:light; /* 只做暖白一种配色（他点名要白橙） */
  --hb:56px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
h1,h2,h3{font-family:var(--serif);margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 顶栏 */
.bar{position:fixed;top:0;left:0;right:0;height:calc(var(--hb) + env(safe-area-inset-top,0px));z-index:5;display:flex;align-items:center;gap:6px;
  padding:env(safe-area-inset-top,0px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));background:var(--bg);border-bottom:1px solid var(--line)}
.home{border:0;background:none;padding:0;cursor:pointer;text-align:left;flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.home .logo{flex:none;width:32px;height:32px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center}
.home .logo svg{width:20px;height:20px}
.home span{min-width:0}
.home b{display:block;font-family:var(--serif);font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;border:0;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:4px}
.pill svg.i{width:15px;height:15px;stroke-width:2.2}
.pill.hot{background:var(--accent);color:#fff}
.pill.avoid{background:var(--bad);color:#fff}
.pill.plain{background:var(--card);color:var(--accent-ink);box-shadow:var(--shadow)}
.pill.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}

/* 分栏 */
.app{position:fixed;left:0;right:0;bottom:0;top:calc(var(--hb) + env(safe-area-inset-top,0px));display:flex;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.col{flex:none;overflow-y:auto;overflow-x:hidden;border-right:1px solid var(--line);transition:width .25s ease;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.col[data-w="0"]{border-right:0}
.detail{flex:1;min-width:0;overflow-y:auto;background:var(--card);padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.detail.off{display:none}
.chead{position:sticky;top:0;z-index:1;background:var(--bg);font-size:12px;font-weight:700;color:var(--muted);padding:10px 14px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghead{display:flex;align-items:baseline;gap:8px;padding:14px 14px 6px;font-size:13px;font-weight:800}
.ghead b{flex:none;white-space:nowrap}
.ghead em{min-width:0;font-style:normal;font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghead.g-zhunbei{color:var(--g1)} .ghead.g-yingzhuang{color:var(--g2)} .ghead.g-ruanzhuang{color:var(--g3)}

/* 行 */
.row{width:100%;border:0;background:none;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:60px;position:relative}
.row+.row::before{content:"";position:absolute;left:14px;right:14px;top:0;border-top:1px solid var(--line)}
.row:hover{background:rgba(217,119,87,.05)}
.row.sel{background:var(--sel)}
.row.sel::after{content:"";position:absolute;right:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent)}
.ic{flex:none;width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(80,50,20,.08)}
.ic svg.i{width:22px;height:22px}
/* 三大部分 = 三个带底色的大框；图标统一一种颜色 */
.gbox{margin:10px 10px 0;border-radius:18px;padding:0 0 6px;overflow:hidden}
.gbox.g-zhunbei{background:#E8F1E5} .gbox.g-yingzhuang{background:#FBEADF} .gbox.g-ruanzhuang{background:#E3ECF6}
.gbox .row+.row::before{border-top-color:rgba(60,40,20,.08)}
.gbox .row:hover{background:rgba(255,255,255,.45)}
.gbox .row.sel{background:rgba(255,255,255,.75)}
/* 现在这一步：整行实心橙色 */
.row.now{background:var(--accent)!important;color:#fff;border-radius:14px;margin:2px 6px;width:calc(100% - 12px);box-shadow:0 4px 14px rgba(217,119,87,.35)}
.row.now+.row::before,.row+.row.now::before{display:none}
.row.now .tx small,.row.now .tx em{color:rgba(255,255,255,.88)}
.row.now .arr{color:rgba(255,255,255,.8)}
.row.now .ic{background:#fff;color:var(--accent-ink);box-shadow:none}
.row.now .badge{background:#fff;color:var(--accent-ink)}
.row.now.sel::after{background:#fff}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.row .tx small{font-size:11px;color:var(--muted);line-height:1.3}
.row .tx b{font-size:16px;line-height:1.35}
.row .tx em{font-style:normal;font-size:12px;color:var(--muted);line-height:1.4}
.badge{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:#fff;background:var(--accent);border-radius:999px;padding:0 7px;line-height:1.7;vertical-align:2px}
.row .arr{flex:none;color:#C9BEB2;font-size:18px}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.when{display:inline-block;font-size:11px;font-weight:700;color:var(--muted);background:var(--line);border-radius:5px;padding:0 6px;line-height:1.7;margin-right:6px}
.th{flex:none;width:54px;height:54px;border-radius:10px;object-fit:cover;background:var(--bg);display:flex;align-items:center;justify-content:center}
.th.t-law{background:#EEF2F7;color:var(--g3)} .th.t-money{background:var(--warn-soft);color:var(--warn)} .th.t-list{background:var(--g1-soft);color:var(--g1)}
.row .meta{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.todo{margin:10px 14px 0;border:1.5px dashed var(--line);border-radius:12px;padding:9px 12px;font-size:13px;color:var(--muted)}
.todo b{color:var(--ink);font-weight:600}

/* 窄列：图标 / 编号 + 名字 */
.col.slim .chead,.col.slim .ghead em,.col.slim .row .tx small,.col.slim .row .tx em,.col.slim .row .arr,.col.slim .row .meta,.col.slim .todo,.col.slim .badge,.col.slim .when{display:none}
.col.slim .ghead{justify-content:center;padding:8px 2px 2px;font-size:10px}
.col.slim .gbox{margin:6px 4px 0;border-radius:12px}
.col.slim .row.now{margin:2px 3px;width:calc(100% - 6px);border-radius:10px}
.col.slim .row{flex-direction:column;justify-content:center;gap:4px;padding:8px 3px;text-align:center;min-height:64px}
.col.slim .row+.row::before{left:8px;right:8px}
.col.slim .row .tx{align-items:center}
.col.slim .row .tx b{font-size:11.5px;line-height:1.25;word-break:break-all}
.col.slim .ic{width:34px;height:34px;border-radius:10px}
.col.slim .ic svg.i{width:18px;height:18px}
.col.slim .num{width:24px;height:24px;font-size:12px}
.col.slim .th{width:44px;height:44px}
.col.slim.xs .row .tx b{font-size:10.5px}
.col.slim.xs .ic{width:30px;height:30px}

.chip{font-size:11px;font-weight:700;border-radius:5px;padding:0 6px;white-space:nowrap;line-height:1.7}
.c-good{background:var(--good-soft);color:var(--good)} .c-warn{background:var(--warn-soft);color:var(--warn)}
.c-pref{background:var(--pref-soft);color:var(--pref)} .c-bad{background:var(--bad-soft);color:var(--bad)}
.c-hot{background:var(--accent-soft);color:var(--accent-ink)}

/* 首页卡片（手机首页在第 1 列顶上；电脑在右边） */
.cards{display:flex;flex-direction:column;gap:10px;padding:14px 14px 4px}
.nowcard{border:0;width:100%;text-align:left;cursor:pointer;background:var(--accent);color:#fff;border-radius:18px;padding:16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
.nowcard .ic{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.22);color:#fff}
.nowcard .ic svg.i{width:28px;height:28px}
.nowcard small{display:block;font-size:12px;opacity:.85}
.nowcard b{font-family:var(--serif);font-size:21px;display:block;line-height:1.25}
.nowcard em{font-style:normal;font-size:12.5px;opacity:.9}
.minicard{border:0;width:100%;text-align:left;cursor:pointer;background:var(--card);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.minicard .ic{width:36px;height:36px;border-radius:11px}
.minicard b{display:block;font-size:15px} .minicard em{font-style:normal;font-size:12px;color:var(--muted)}
.minicard .arr{margin-left:auto;color:#C9BEB2;font-size:18px}
.ic.hot{background:var(--accent-soft);color:var(--accent-ink)} .ic.bad{background:var(--bad-soft);color:var(--bad)}

/* 详情 */
.dv{max-width:760px;margin:0 auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.crumb{font-size:12px;color:var(--muted)}
.dv h2{font-size:24px;font-weight:800}
.dv .hero{width:100%;max-height:52vh;aspect-ratio:6/5;object-fit:cover;border-radius:14px;display:block;background:var(--bg)}
.dv .heroic{width:100%;aspect-ratio:3/1;border-radius:14px;display:flex;align-items:center;justify-content:center}
.dv .heroic svg.i{width:46px;height:46px;stroke-width:1.5}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags .chip{font-size:13px;padding:1px 10px}
.blk{display:flex;flex-direction:column;gap:2px}
.blk .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.blk p{font-size:16px}
.blk.note{background:var(--bg);border-radius:12px;padding:10px 12px}
.blk.note .lbl{color:var(--accent-ink)}
.src{font-size:13px;color:var(--muted)}
.nav2{display:flex;gap:8px;margin-top:6px}
.nav2 button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;font-size:13px;cursor:pointer;color:var(--accent-ink);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.nav2 button.nx{text-align:right}
.stagehero{border-radius:18px;padding:18px;display:flex;gap:14px;align-items:center}
.stagehero .ic{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.7)}
.stagehero .ic svg.i{width:30px;height:30px}
.stagehero small{display:block;font-size:12px;font-weight:700}
.stagehero h2{font-size:24px}
.stagehero p{font-size:14px;color:var(--ink)}
.stagehero.g-zhunbei{background:var(--g1-soft)} .stagehero.g-zhunbei small{color:var(--g1)}
.stagehero.g-yingzhuang{background:var(--g2-soft)} .stagehero.g-yingzhuang small{color:var(--g2)}
.stagehero.g-ruanzhuang{background:var(--g3-soft)} .stagehero.g-ruanzhuang small{color:var(--g3)}
.flow{display:flex;flex-direction:column;gap:0;position:relative}
.scard{border:0;background:none;text-align:left;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:10px 0;position:relative}
.scard:not(:last-child)::before{content:"";position:absolute;left:13.5px;top:40px;bottom:-10px;border-left:2px dotted var(--line)}
.scard .num{background:var(--accent);color:#fff}
.scard b{font-size:16px}
.scard em{font-style:normal;font-size:13px;color:var(--muted);display:block}
.scard.gap em{color:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.gcard{border:0;padding:0;background:var(--bg);border-radius:12px;overflow:hidden;text-align:left;cursor:pointer;display:flex;flex-direction:column}
.gcard img,.gcard .ph{width:100%;aspect-ratio:4/3;object-fit:cover;display:flex;align-items:center;justify-content:center}
.gcard .ph svg.i{width:30px;height:30px}
.gcard span{padding:6px 8px 8px;font-size:13px;font-weight:600;line-height:1.35;display:flex;flex-direction:column;gap:3px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:14px}
.dv a{color:var(--accent-ink)}
.dv ol{margin:0;padding-left:20px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.groups{display:flex;flex-direction:column;gap:6px;font-size:14px}
.groups span b{margin-right:4px}

@media (max-width:899px){ .dv{padding:14px} .dv h2{font-size:20px} .blk p{font-size:15px} .stagehero{padding:14px} .stagehero h2{font-size:20px} }
@media (max-width:520px){
  .home small{display:none} .home .logo{display:none}
  .pill{padding:6px 8px;font-size:12px} .pill .lb{display:none}
}

/* 每个阶段「心里要有数」 */
.tips{margin:10px 12px 4px;background:#FFF7E8;border:1px solid #F3E2C2;border-radius:14px;padding:10px 12px;font-size:13.5px}
.tips b{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--warn)}
.tips b svg.i{width:17px;height:17px}
.tips ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px;color:var(--ink)}
.dv .tips{margin:0;font-size:15px} .dv .tips b{font-size:15px}
.col.slim .tips{display:none}
/* 别照做：红色提醒 */
.row.badrow{background:#FDF1EE}
.row.badrow .tx b{color:var(--bad)}
.gcard.badrow{outline:2px solid var(--bad-soft)}
.warnt{color:var(--bad);font-weight:700}
.warnbox{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700}
.c-bad{background:var(--bad);color:#fff}

/* 场景小标题 */
.scene{padding:14px 14px 4px;font-size:12px;font-weight:800;color:var(--accent-ink);letter-spacing:.04em}
.col.slim .scene{padding:8px 2px 2px;font-size:10px;text-align:center}
.dv h3.sh{font-size:17px;margin-top:6px;color:var(--accent-ink)}
</style>
</head><body>

uidian", "b": "jiadian", "img": "fridge", "t": "插座别藏在家电后面", "tag": "good", "key": 2, "src": [4, 12], "say": "冰箱、洗碗机、洗衣机、电视的插座留在旁边柜子或上下方；每个房间要几个插座、多高，自己先列清单。", "note": "前提是家电型号和家具位置先定好。沙发、柜子会挡住后面的插座。", "law": "", "scene": "全屋"}, {"id": "heater", "s": "shuidian", "b": "jiadian", "img": "heater", "t": "热水器先定方案", "tag": "warn", "key": 2, "src": [12, 4], "say": "燃气还是电、明装还是藏进柜子、要不要零冷水，都要在水电前定。", "note": "零冷水开龙头就有热水，但要多埋回水管或加循环，会多用一点燃气和电（推断）。燃气热水器要先打排烟孔。", "law": "", "scene": "全屋"}, {"id": "wifi", "s": "shuidian", "b": "jiadian", "img": "wifi", "t": "全屋 WiFi 先布网线", "tag": "good", "key": 2, "src": [4, 8, 12], "say": "弱电箱做大；弱电箱到客厅布 3 根网线，到每个房间各 1 根；用超六类网线。", "note": "根数是文章的建议，按自家房间数调整。墙上的 WiFi 面板会发热，选大牌（[8] 说的）。", "law": "", "scene": "全屋"}, {"id": "dock", "s": "shuidian", "b": "jiadian", "img": "dock", "t": "扫地机留水电位", "tag": "warn", "key": 1, "src": [2, 4, 12], "say": "上下水款基站要留进水、排水和电源，高度要卡准。", "note": "先选好买哪款再留。也有人觉得扫地机拖不干净，见「先别照做」。", "law": "", "scene": "全屋"}, {"id": "robot", "s": "shuidian", "b": "jiadian", "img": "rail", "t": "有扫地机就不用扫？", "tag": "warn", "key": 0, "src": [2], "say": "[2] 整篇围着扫地机设计。", "note": "评论区很多人说拖不干净、要常维护；也有人觉得请保洁加吸尘器更省事。到买家电时再定。", "law": "", "scene": "全屋"}, {"id": "dishwasher", "s": "shuidian", "b": "jiadian", "img": "dishwasher", "t": "洗碗机留水电", "tag": "good", "key": 1, "src": [2, 4, 12], "say": "放在水槽旁边，留进水、排水，插座留在隔壁柜。", "note": "先定嵌入式还是台式、多宽，柜子按机器尺寸做。", "law": "", "scene": "厨房"}, {"id": "oven", "s": "shuidian", "b": "jiadian", "img": "oven", "t": "蒸烤箱留专用电", "tag": "good", "key": 1, "src": [2, 4, 12], "say": "功率大，单独一路电；插座在上方或下方；柜子背后少做背板，方便散热。", "note": "先查机器要 10A 还是 16A 插座。", "law": "", "scene": "厨房"}, {"id": "water", "s": "shuidian", "b": "jiadian", "img": "water", "t": "净水和直饮机", "tag": "warn", "key": 1, "src": [2, 4, 12, 13], "say": "前置过滤、净水机、软水机、直饮机，选哪几样先定，水槽下留插座和水口。", "note": "装不装、装几样看预算和当地水质，不是必须（推断）。", "law": "", "scene": "厨房"}, {"id": "toilet", "s": "shuidian", "b": "jiadian", "img": "toilet", "t": "智能马桶留插座", "tag": "good", "key": 1, "src": [4, 12], "say": "马桶侧边离地约 30 cm 留一个防水插座。", "note": "壁挂马桶还要让水电工、瓦工、商家对齐尺寸。", "law": "", "scene": "卫生间"}, {"id": "towel", "s": "shuidian", "b": "jiadian", "img": "towel", "t": "电热毛巾架留电", "tag": "warn", "key": 1, "src": [4, 12], "say": "卫生间墙上预留电源。", "note": "[4] 说要单独一路线；功率小的型号接卫生间插座回路也常见（推断），按产品说明来。", "law": "", "scene": "卫生间"}, {"id": "tv", "s": "shuidian", "b": "jiadian", "img": "tv", "t": "电视墙埋一根管", "tag": "good", "key": 2, "src": [4, 12], "say": "电视后面预埋一根粗管走线，插座留在左右下方。", "note": "先定电视挂墙还是放柜子、多大。文章给的参考：55 寸大约坐 1.9–3.1 m 远。", "law": "", "scene": "客厅卧室"}, {"id": "aircon", "s": "shuidian", "b": "jiadian", "img": "aircon", "t": "空调先定类型", "tag": "good", "key": 1, "src": [4, 12], "say": "挂机、柜机、风管机还是中央空调先定；风管机和中央空调要配合吊顶，还要留冷凝水排水管。", "note": "出风口别对着床和沙发。", "law": "", "scene": "客厅卧室"}, {"id": "washer", "s": "shuidian", "b": "jiadian", "img": "washer", "t": "洗衣机 + 烘干机", "tag": "good", "key": 1, "src": [2, 4, 12], "say": "先定叠放还是并排、上排水还是下排水，再留插座、上下水和地漏。", "note": "昆山梅雨季衣服难晾干，烘干机比较实用（推断）。想加一台洗内衣的小洗衣机，就一起留位置。", "law": "", "scene": "阳台"}, {"id": "kaiguan", "s": "shuidian", "b": "fangan", "img": "kaiguan", "t": "开关插座自己列清单", "tag": "good", "key": 0, "src": [4, 6], "say": "每个房间的开关插座数量和高度自己列好；卧室门口和床头做双控。", "note": "点位图写进合同，后期加点位不容易被高价收钱。", "law": ""}, {"id": "dengwei", "s": "shuidian", "b": "fangan", "img": "dengwei", "t": "灯位改到中间", "tag": "warn", "key": 0, "src": [9], "say": "开发商的灯位不居中就改：餐厅对着餐桌，卧室对着做完柜子以后的中间。", "note": "要先定家具位置。", "law": ""}, {"id": "circuit", "s": "shuidian", "b": "fangan", "img": "circuit", "t": "大功率电器单独一路", "tag": "good", "key": 2, "src": [4, 9, 12], "say": "空调、蒸烤箱、电热水器各走一路电；大功率用 4 平方线，普通插座用 2.5 平方。", "note": "具体线径按电器功率，由电工设计。", "law": ""}, {"id": "loubao", "s": "shuidian", "b": "fangan", "img": null, "t": "插座回路装漏电保护", "tag": "good", "key": 0, "src": [], "say": "除壁挂空调的插座外，插座回路都要装漏电保护；卫生间插座最好单独一路。", "note": "文章都没提，是我查规范补上的。电箱里看得到，验收时问电工。", "law": "住宅设计规范 GB 50096-2011 第 8.7.2 条", "icon": "law"}, {"id": "wallpipe", "s": "shuidian", "b": "fangan", "img": "wallpipe", "t": "洗脸盆下水走墙里", "tag": "good", "key": 2, "src": [2, 13], "say": "下水从墙里出，盆下面空着，好打扫。", "note": "要在水电时预埋，台盆和下水器要买墙排款；以后想改只能砸墙。", "law": ""}, {"id": "pipe-top", "s": "shuidian", "b": "fangan", "img": "pipe-top", "t": "水管走顶还是走地", "tag": "warn", "key": 2, "src": [4], "say": "[4] 说卫生间水管必须走顶：漏水能第一时间看到，修的时候不用砸砖。", "note": "走顶管子更长，热水要多等一会儿；冷水管要包保温防结露。走地只要打压合格、接头少也可以。两种都行，水电前定下来（推断）。", "law": ""}, {"id": "valve", "s": "shuidian", "b": "fangan", "img": "valve", "t": "止逆阀先看有没有", "tag": "warn", "key": 1, "src": [11], "say": "[11] 说马桶进水、厨房烟道、卫生间排风口要装止逆阀，洗衣机换自动止水角阀。", "note": "住宅规范本来就要求公共烟道防倒灌（GB 50096 第 6.8.2 条），很多马桶进水阀也自带防倒流设计，先看家里有没有再买（推断）。烟道和排风口的要在吊顶前装。", "law": ""}, {"id": "cailiao", "s": "shuidian", "b": "cailiao", "img": "cailiao", "t": "电线水管网线选对", "tag": "good", "key": 0, "src": [9, 4], "say": "电线用 BV 单股硬线，给水用 PPR 管，网线用超六类（标 CAT6A）。品牌型号写进合同。", "note": "", "law": ""}, {"id": "vslot", "s": "shuidian", "b": "shigong", "img": "vslot", "t": "墙上尽量开竖槽", "tag": "good", "key": 0, "src": [4, 9, 13], "say": "尽量开竖槽；横槽要短（文章说非混凝土墙不超过 50 cm、混凝土墙不超过 30 cm），承重墙不乱开。", "note": "具体限制以物业和结构要求为准。", "law": ""}, {"id": "wire-sep", "s": "shuidian", "b": "shigong", "img": "wire-sep", "t": "强电弱电分开走", "tag": "good", "key": 1, "src": [4, 9], "say": "电线和网线不走同一个槽，隔开一段距离，交叉处垂直交叉。", "note": "文章说隔 30 cm。旧版布线规范（GB 50311-2007）对普通家用电线的要求大约是平行隔 13 cm，30 cm 更保守，做得到更好；新版的数字我没查到。锡箔纸见「先别照做」。", "law": ""}, {"id": "foil", "s": "shuidian", "b": "shigong", "img": "foil", "t": "包锡箔纸能提网速？", "tag": "bad", "key": 0, "src": [1, 4, 9, 13], "say": "4 篇都说电线交叉处要包锡箔纸，有的说包了网速会变快。", "note": "锡箔纸不接地，起不了多少屏蔽作用；网线本身抗干扰。规范讲的是间距和接地的金属管，不是锡箔纸（推断）。包了无害，别指望提速。", "law": ""}, {"id": "chuanxian", "s": "shuidian", "b": "shigong", "img": "chuanxian", "t": "线管别塞太满", "tag": "warn", "key": 0, "src": [9], "say": "一根线管里的线别太多，转弯做大弧度，以后才能换线。", "note": "文章说不超过管截面的 40%。", "law": ""}, {"id": "hotcold", "s": "shuidian", "b": "shigong", "img": "hotcold", "t": "冷热水口左热右冷", "tag": "good", "key": 0, "src": [4, 9, 13], "say": "两个出水口间距 15 cm，保持水平，左热右冷。", "note": "龙头和花洒装不上，多半是这里没做准。", "law": ""}, {"id": "geyin", "s": "shuidian", "b": "shigong", "img": null, "t": "下水管包隔音棉", "tag": "good", "key": 0, "src": [4, 6], "say": "下水管包隔音棉，挡楼上冲水的声音。", "note": "包管的材料和做法写进报价。", "law": "", "icon": "list"}, {"id": "dengdianwei", "s": "shuidian", "b": "shigong", "img": null, "t": "卫生间做等电位", "tag": "good", "key": 0, "src": [4], "say": "有洗浴设备的卫生间要做局部等电位，别为了好看封死。", "note": "规范要求的，关系到用电安全。", "law": "住宅设计规范 GB 50096-2011 第 8.7.2 条", "icon": "law"}, {"id": "xianhe", "s": "shuidian", "b": "shigong", "img": "xianhe", "t": "改完电盖线盒保护盖", "tag": "warn", "key": 0, "src": [9], "say": "防止后面贴砖刷墙时，水泥堵住线盒。", "note": "", "law": ""}, {"id": "pressure", "s": "shuidian", "b": "yanshou", "img": "pressure", "t": "水管打压测试", "tag": "good", "key": 2, "src": [4, 13], "say": "加压到 0.8–1.0 MPa，30 分钟不掉压就合格。", "note": "规范更严：塑料水管在试验压力（工作压力的 1.5 倍，不低于 0.6 MPa）下稳压 1 小时，压降不超过 0.05 MPa；再在 1.15 倍工作压力下稳压 2 小时，压降不超过 0.03 MPa。让师傅按规范做，拍压力表留证。", "law": "给排水验收规范 GB 50242-2002 第 4.2.1 条"}, {"id": "tongdian", "s": "shuidian", "b": "yanshou", "img": null, "t": "通电和绝缘测试", "tag": "good", "key": 0, "src": [4], "say": "每个插座都通电测一遍、测绝缘，贴砖前做。", "note": "", "law": "", "icon": "list"}, {"id": "photo-check", "s": "shuidian", "b": "yanshou", "img": "photo-check", "t": "封槽前每面墙拍照", "tag": "good", "key": 2, "src": [13, 4], "say": "每面墙、地面、每个底盒（旁边放卷尺）都拍下来，再录一段走一圈的视频；完工要一份水电走向图。", "note": "几乎零成本，以后打孔、维修、扯皮都用得上。", "law": ""}, {"id": "bishui", "s": "niwa", "b": "fangshui", "img": "bishui", "t": "防水和闭水试验", "tag": "good", "key": 1, "src": [4, 6, 10], "say": "防水刷两遍，淋浴区刷到 1.8 m，闭水 48 小时，去楼下看漏不漏。", "note": "规范要求：淋浴区墙面防水至少 2.0 m（不低于花洒），洗手盆处至少 1.2 m；蓄水至少 2 cm 深、至少 24 小时。文章的 1.8 m 是旧标准，按 2.0 m 做；闭水做到 48 小时更保险。", "law": "防水通用规范 GB 55030-2022 第 4.6.4、6.0.12 条"}, {"id": "lamao", "s": "niwa", "b": "qiangzhuan", "img": "lamao", "t": "贴砖前墙面拉毛", "tag": "good", "key": 0, "src": [1, 3], "say": "把墙面滚粗糙，瓷砖粘得牢。", "note": "大砖还要配瓷砖胶，拉毛不是唯一保证（推断）。", "law": ""}, {"id": "tiezhuan-xijie", "s": "niwa", "b": "qiangzhuan", "img": "tiezhuan-xijie", "t": "贴砖的几个细节", "tag": "warn", "key": 0, "src": [3, 6], "say": "墙砖压地砖、墙地砖对缝、转角做海棠角、贴完逐块检查空鼓。", "note": "海棠角有的会按米另收倒角费（[6]），先写进报价。", "law": ""}, {"id": "tongpu", "s": "niwa", "b": "dizhuan", "img": "tongpu", "t": "全屋地面通铺", "tag": "warn", "key": 1, "src": [2, 3], "say": "不做门槛石和高低差，不藏灰，扫地机能过。", "note": "卫生间没了门槛石挡水，要靠地面下沉、找坡和长条地漏；规范要求用水房间和别的房间交接处要有挡水措施（GB 55030 第 4.6.4 条），问清师傅怎么做。", "law": ""}, {"id": "drain", "s": "niwa", "b": "dizhuan", "img": "drain", "t": "地漏和找坡", "tag": "good", "key": 0, "src": [3, 10], "say": "地面朝地漏找坡，地漏周围切成回字形；地漏别对着门口、别藏在柜子下面。", "note": "切法是工艺选择，关键是坡度做对、不积水。", "law": ""}, {"id": "rail", "s": "niwa", "b": "dizhuan", "img": "rail", "t": "推拉门不做地轨", "tag": "warn", "key": 0, "src": [2], "say": "地轨缝里藏灰，扫地机也过不去，可以用吊轨推拉门。", "note": "吊轨门底下有缝，隔音和稳定性差一些（推断）。", "law": ""}, {"id": "simple-ceiling", "s": "mugong", "b": "diaoding", "img": "simple-ceiling", "t": "吊顶少做造型", "tag": "pref", "key": 0, "src": [2], "say": "不做线条和雕花，凹凸少就不积灰。", "note": "看你们喜欢的风格。", "law": ""}, {"id": "ceiling", "s": "mugong", "b": "diaoding", "img": "ceiling", "t": "吊顶塞棉防楼上吵？", "tag": "bad", "key": 0, "src": [1], "say": "吊顶里塞隔音棉，挡楼上的噪音。", "note": "楼上的脚步声多从楼板和墙传下来，只塞吊顶效果有限（推断，评论区也多人质疑）。下水管包隔音棉是另一回事。", "law": ""}, {"id": "chuanglianhe", "s": "mugong", "b": "diaoding", "img": null, "t": "窗帘盒一起报价", "tag": "warn", "key": 0, "src": [6], "say": "做吊顶时把窗帘盒一起算进去，后期加要按米收钱。", "note": "", "law": "", "icon": "money"}, {"id": "plain-cab", "s": "mugong", "b": "guizi", "img": "plain-cab", "t": "柜门全封闭", "tag": "pref", "key": 0, "src": [2], "say": "不做开放格、不用玻璃门，柜子不积灰。", "note": "想摆东西展示的地方，可以留一两格。", "law": ""}, {"id": "counter", "s": "mugong", "b": "guizi", "img": "counter", "t": "厨房台面清空", "tag": "pref", "key": 0, "src": [2], "say": "东西都收进柜子，做完饭一擦就干净。", "note": "前提是柜子收纳够用。", "law": ""}, {"id": "basket", "s": "mugong", "b": "guizi", "img": "basket", "t": "调料放抽屉拉篮", "tag": "pref", "key": 0, "src": [2], "say": "常用的放灶台下的抽屉，不常用的放吊柜拉篮。", "note": "", "law": ""}, {"id": "wardrobe", "s": "mugong", "b": "gu , "say": "灯具、开关面板、角阀、热水器辅材的安装费，问清是否包含。", "note": "", "law": "", "icon": "money"}, {"id": "floor-sit", "s": "ruanzhuang", "b": "jiaju", "img": "floor-sit", "t": "家具做到贴地", "tag": "pref", "key": 0, "src": [2], "say": "底下没有缝，不用钻进去扫。", "note": "", "law": ""}, {"id": "furn-lift", "s": "ruanzhuang", "b": "jiaju", "img": "furn-lift", "t": "或者离地 10 cm", "tag": "pref", "key": 0, "src": [2], "say": "扫地机能钻进去扫。", "note": "买扫地机前量一下机身多高。", "law": ""}, {"id": "shafa", "s": "ruanzhuang", "b": "jiaju", "img": null, "t": "大件先量楼道", "tag": "warn", "key": 0, "src": [6], "say": "沙发等大件先量电梯和楼道，写明送货入户。", "note": "", "law": "", "icon": "list"}, {"id": "curtain", "s": "ruanzhuang", "b": "chuanglian", "img": "curtain", "t": "窗帘离地 10 cm", "tag": "pref", "key": 0, "src": [2, 6], "say": "窗帘离地一点，不拖地不脏；褶皱做 1.8–2 倍。", "note": "离地的做法有人不喜欢，看效果选。", "law": ""}, {"id": "window-bot", "s": "ruanzhuang", "b": "jiadian", "img": "window-bot", "t": "擦窗机器人", "tag": "pref", "key": 0, "src": [2], "say": "吸在玻璃上自己擦，不用请人擦窗。", "note": "", "law": ""}], "groups": [{"id": "zhunbei", "name": "准备", "desc": "还没动工：设计、预算、签合同"}, {"id": "yingzhuang", "name": "硬装", "desc": "动工施工：从拆墙到装好门窗洁具，住进去就不好改了"}, {"id": "ruanzhuang", "name": "软装入住", "desc": "搬东西进来、验收、通风"}]}/*DATA_END*/</script>
<script>
const RAW=document.getElementById("data").textContent, D=JSON.parse(RAW.slice(RAW.indexOf("{"),RAW.lastIndexOf("}")+1));
const SRC=D.src, ITEMS=D.items, NOW=D.now, STAGES=D.stages, GROUPS=D.groups;
const TAG={good:"推荐",warn:"看情况",pref:"看喜好",bad:"⚠ 别照做"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// 正文里的来源编号（如 [4]）爸妈看不懂，显示成「有文章」
const tx=s=>esc(String(s).replace(/(\[\d+\])+ ?/g,"有文章"));
// claude 链接版把图片直接塞进页面（window.IMGS），因为 Safari 拦第三方 cookie，单独加载的图片会打不开（11/18 他截图）
const img=n=>(window.IMGS&&window.IMGS[n])||`img/${n}.jpg`;
const evid=i=>i.law?`依据规范：${i.law}`:i.src.length>1?`${i.src.length} 篇都这么说`:`只有 1 篇这么说`;
const stageOf=id=>STAGES.find(s=>s.id===id);
const itemsOf=(s,b)=>ITEMS.filter(i=>i.s===s&&(!b||i.b===b));
const groupOf=s=>GROUPS.find(g=>g.id===s.group);
document.getElementById("upd").textContent=`对照国家规范整理 · ${D.updated}`;

/* 图标：每个阶段一个线条图 */
const P={
  qianqi:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9z"/><path d="M8.5 11h7M8.5 15h5"/>',
  chaigai:'<path d="M13.5 3.5l5 5-2.6 2.6-5-5z"/><path d="M12.2 9.8L4 18l2 2 8.2-8.2"/>',
  shuidian:'<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',
  niwa:'<rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M3 9.7h18M3 14.3h18M9 5v4.7M15 9.7v4.6M9 14.3V19"/>',
  mugong:'<path d="M4 20V5l15 15z"/><path d="M8 16v-3.5l3.5 3.5z"/>',
  youqi:'<rect x="4" y="3" width="13" height="5" rx="1.5"/><path d="M17 5.5h2.5V11H11v3"/><rect x="9.5" y="14" width="3" height="7" rx="1"/>',
  anzhuang:'<path d="M6 21V4a1 1 0 011-1h10a1 1 0 011 1v17"/><path d="M4 21h16"/><circle cx="14.5" cy="12.5" r=".8"/>',
  ruanzhuang:'<path d="M5 11V8a2 2 0 012-2h10a2 2 0 012 2v3"/><path d="M3 13a2 2 0 014 0v2h10v-2a2 2 0 014 0v5H3z"/><path d="M5 18v2M19 18v2"/>',
  shouwei:'<circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l2 2M14 9l2 2"/>',
  law:'<path d="M5 4.5A1.5 1.5 0 016.5 3H19v15H6.5A1.5 1.5 0 005 19.5z"/><path d="M5 19.5A1.5 1.5 0 006.5 21H19"/><path d="M9 7.5h6"/>',
  money:'<circle cx="12" cy="12" r="8.5"/><path d="M9 7.5l3 4 3-4M12 11.5V17M9.5 12.5h5M9.5 15h5"/>',
  list:'<path d="M10 6h10M10 12h10M10 18h10"/><path d="M4 6l1.2 1.2L7.5 5M4 12l1.2 1.2L7.5 11M4 18l1.2 1.2L7.5 17"/>',
  bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0012 3z"/>',
};
const svg=k=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[k]||P.list}</svg>`;
const thumb=(i,cls="th")=>i.img?`<img class="${cls}" src="${img(i.img)}" alt="">`:`<span class="${cls} t-${i.icon}">${svg(i.icon)}</span>`;
// 按场景分组（目前只有「水电 · 定家电和设备」有场景）：head 是场景标题，wrap 包住同一场景的条目
function bySceneHTML(its,one,head,wrap){
  if(!its.some(i=>i.scene)) return wrap(its.map(one).join(""));
  const out=[]; let cur=null, buf=[];
  const flush=()=>{if(buf.length) out.push(wrap(buf.join(""))); buf=[]};
  its.forEach(i=>{ if(i.scene!==cur){flush(); cur=i.scene; out.push(head(cur));} buf.push(one(i)); });
  flush(); return out.join("");
}
const tipsBox=S=>S.tips&&S.tips.length?`<div class="tips"><b>${svg("bulb")}${esc(S.name)}这一阶段，心里要有数</b><ul>${S.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`:"";

/* 路由：#shuidian / #shuidian--jiadian / #shuidian--jiadian--heater / #info */
function parse(){const h=decodeURIComponent(location.hash.slice(1));if(h==="info")return{page:h};
  const [s,b,i]=h?h.split("--"):[];return{s:s||null,b:b||null,i:i||null}}
const go=(...a)=>{location.hash=a.filter(Boolean).join("--")};

const c1=document.getElementById("c1"),c2=document.getElementById("c2"),c3=document.getElementById("c3"),dt=document.getElementById("dt");
function setW(el,w,slim,xs){el.style.width=w+"px";el.dataset.w=w?"1":"0";el.classList.toggle("slim",!!slim);el.classList.toggle("xs",!!xs)}

function rowStage(s,sel){const k=STAGES.indexOf(s), n=itemsOf(s.id).length, now=s.id===NOW;
  return `<button class="row ${sel?"sel":""} ${now?"now":""}" data-go="${s.id}"><span class="ic">${svg(s.id)}</span><span class="tx"><small>第 ${k+1} 步${now?" · 现在":""}</small><b>${esc(s.name)}</b><em>${s.branches.length} 步 · ${n} 条</em></span><span class="arr">›</span></button>`}
function stageList(sel){
  return GROUPS.map(g=>`<div class="gbox g-${g.id}"><div class="ghead g-${g.id}"><b>${esc(g.name)}</b><em>${esc(g.desc)}</em></div>`+STAGES.filter(s=>s.group===g.id).map(s=>rowStage(s,s.id===sel)).join("")+`</div>`).join("");
}
function rowStep(s,b,k,sel){const n=itemsOf(s.id,b.id).length, bad=itemsOf(s.id,b.id).some(i=>i.tag==="bad");
  return `<button class="row ${sel?"sel":""}" data-go="${s.id}--${b.id}"><span class="num">${k+1}</span><span class="tx"><small>第 ${k+1} 步</small><b>${esc(b.name)}</b><em>${n?n+" 条":"还没收集文章"}${b.scenes?" · 按场景分 "+b.scenes.length+" 类":""}${bad?' · <span class="warnt">含 1 条别照做</span>':""}</em></span><span class="arr">›</span></button>`}
function rowItem(s,b,i,sel){
  return `<button class="row ${sel?"sel":""} ${i.tag==="bad"?"badrow":""}" data-go="${s}--${b}--${i.id}">${thumb(i)}<span class="tx"><b>${esc(i.t)}</b><span class="meta"><span class="chip c-${i.tag}">${TAG[i.tag]}</span>${i.key?'<span class="chip c-hot">⚡ 水电前定</span>':""}</span></span></button>`}
function nowCard(){const s=stageOf(NOW), k=STAGES.indexOf(s);
  return `<div class="cards"><button class="nowcard" data-go="${NOW}"><span class="ic">${svg(NOW)}</span><span><small>现在在第 ${k+1} 步</small><b>${esc(s.name)}</b><em>${esc(s.desc)}</em></span></button></div>`}

function render(){
  const st=parse(), W=innerWidth>=900, MID=innerWidth>=600&&!W;
  document.getElementById("p-info").classList.toggle("on",st.page==="info");
  const S=st.s&&stageOf(st.s), B=S&&st.b&&S.branches.find(b=>b.id===st.b), I=B&&st.i&&ITEMS.find(x=>x.id===st.i);
  // 层级：0 首页，1 选了阶段，2 选了步骤，3 选了条目；「说明」页按 1 处理
  const lv=I?3:B?2:S?1:st.page?1:0;
  const phoneHome=!W&&!MID&&lv===0;
  c1.innerHTML=(phoneHome?nowCard():"")+stageList(st.s);
  c2.innerHTML=S?`<div class="chead">${esc(S.name)} · 按先后分 ${S.branches.length} 步</div>`+tipsBox(S)+S.branches.map((b,k)=>rowStep(S,b,k,B&&b.id===B.id)).join(""):"";
  const its=B?itemsOf(S.id,B.id):[];
  c3.innerHTML=B?`<div class="chead">第 ${S.branches.indexOf(B)+1} 步 · ${esc(B.name)} · ${its.length} 条</div>`+bySceneHTML(its,i=>rowItem(S.id,B.id,i,I&&i.id===I.id),sc=>`<div class="scene">${esc(sc)}</div>`,x=>x)+(B.todo||[]).map(t=>`<div class="todo">☐ <b>还没收集到文章</b>，但这一步要做：${esc(t)}</div>`).join(""):"";
  const vw=innerWidth, info=st.page==="info"; let L;
  if(W){ L=info?[230,0,0,1]:[[340,0,0,1],[230,280,0,1],[150,200,330,1],[150,200,330,1]][lv]; setW(c1,L[0],lv>=2);setW(c2,L[1],lv>=2);setW(c3,L[2],false); }
  else if(MID){ L=info?[84,0,0,1]:[[280,0,0,1],[84,250,0,1],[76,92,260,1],[76,92,260,1]][lv]; setW(c1,L[0],lv>=1);setW(c2,L[1],lv>=2);setW(c3,L[2],false); }
  else{
    L=info?[64,0,0,1]:[[vw,0,0,0],[72,vw-72,0,0],[58,72,vw-130,0],[48,58,80,1]][lv];
    setW(c1,L[0],lv>0,lv>=2);setW(c2,L[1],lv>=2,lv>=3);setW(c3,L[2],lv>=3,lv>=3);
  }
  dt.classList.toggle("off",!L[3]);
  dt.innerHTML=info?vInfo():I?vItem(S,B,I,its):B?vStep(S,B,its):S?vStage(S):vHome();
  dt.scrollTop=0;
  document.querySelectorAll(".row.sel").forEach(r=>r.scrollIntoView({block:"nearest"}));
}

function vHome(){return `<div class="dv">${nowCard().replace('class="cards"','class="cards" style="padding:0"')}<p class="src">从左边选一个阶段，往右一层层点开。</p>${tipsBox(stageOf(NOW))}</div>`}
function vInfo(){return `<div class="dv"><h2>怎么看</h2>
  <div class="legend"><span>最左一列是装修的 9 个阶段，分 3 大部分：</span>
  <div class="groups">${GROUPS.map(g=>`<span><b style="color:var(--${g.id==="zhunbei"?"g1":g.id==="yingzhuang"?"g2":"g3"})">${esc(g.name)}</b>${esc(g.desc)}</span>`).join("")}</div>
  <span>点一个阶段，右边出现它的几步（按施工先后排），最上面是这个阶段「心里要有数」的几件事；点一步，出现这一步的条目；点条目，右边显示详细内容。</span>
  <span><span class="chip c-good">推荐</span> 有规范或多篇支持，代价小</span><span><span class="chip c-warn">看情况</span> 有代价或前提，要先确认</span>
  <span><span class="chip c-pref">看喜好</span> 风格和生活习惯</span><span><span class="chip c-bad">⚠ 别照做</span> 网上流行，但说法有问题</span>
  <span><span class="chip c-hot">⚡ 水电前定</span> 要在水电开工前定下来</span>
  <span>没有实拍图的条目用图标表示：书本是国家规范要求，钱币是和费用、合同有关，清单是做法提醒。</span></div>
  <p class="src">「推荐 / 看情况」是小年的判断。文章也会出错，关键数字对照过国家规范，具体做法以规范和施工师傅为准。</p>
  <h2>内容来自</h2><ol>${Object.values(SRC).map(x=>`<li><a href="${x.u}" target="_blank" rel="noopener">${esc(x.p)} · ${esc(x.n)}</a></li>`).join("")}</ol></div>`}
function vStage(S){const g=groupOf(S);
  return `<div class="dv"><div class="stagehero g-${S.group}"><span class="ic">${svg(S.id)}</span><span><small>${esc(g.name)} · 第 ${STAGES.indexOf(S)+1} 步</small><h2>${esc(S.name)}${S.id===NOW?"（现在）":""}</h2><p>${esc(S.desc)}</p></span></div>
  ${tipsBox(S)}
  <div class="flow">${S.branches.map((b,k)=>{const n=itemsOf(S.id,b.id).length;return `<button class="scard ${n?"":"gap"}" data-go="${S.id}--${b.id}"><span class="num">${k+1}</span><span><b>第 ${k+1} 步 · ${esc(b.name)}</b><em>${esc(b.desc)} · ${n?n+" 条":"还没收集文章"}</em></span></button>`}).join("")}</div></div>`}
function vStep(S,B,its){
  return `<div class="dv"><span class="crumb">${esc(S.name)} › 第 ${S.branches.indexOf(B)+1} 步</span><h2>${esc(B.name)}</h2><p>${esc(B.desc)}</p>
  ${its.length?bySceneHTML(its,i=>`<button class="gcard ${i.tag==="bad"?"badrow":""}" data-go="${S.id}--${B.id}--${i.id}">${i.img?`<img src="${img(i.img)}" alt="">`:`<span class="ph t-${i.icon}">${svg(i.icon)}</span>`}<span>${esc(i.t)}<span><span class="chip c-${i.tag}">${TAG[i.tag]}</span></span></span></button>`,sc=>`<h3 class="sh">${esc(sc)}</h3>`,x=>`<div class="grid">${x}</div>`):""}
  ${(B.todo||[]).map(t=>`<div class="todo" style="margin:0">☐ <b>还没收集到文章</b>，但这一步要做：${esc(t)}</div>`).join("")}</div>`}
function vItem(S,B,I,its){
  const k=its.indexOf(I), prev=its[k-1], next=its[k+1];
  return `<div class="dv"><span class="crumb">${esc(S.name)} › 第 ${S.branches.indexOf(B)+1} 步 · ${esc(B.name)}</span>
    ${I.img?`<img class="hero" src="${img(I.img)}" alt="">`:`<div class="heroic th t-${I.icon}">${svg(I.icon)}</div>`}
    ${I.tag==="bad"?`<div class="warnbox">⚠ 网上很多人这么说，但说法有问题，先别照做。看下面「要注意」。</div>`:""}
    <div class="tags"><span class="chip c-${I.tag}">${TAG[I.tag]}</span>${I.key?'<span class="chip c-hot">⚡ 水电开工前要定</span>':""}</div>
    <h2>${esc(I.t)}</h2>
    <div class="blk"><span class="lbl">${I.src.length?"文章说":"规范要求"}</span><p>${tx(I.say)}</p></div>
    ${I.note?`<div class="blk note"><span class="lbl">要注意</span><p>${tx(I.note)}</p></div>`:""}
    <p class="src">${esc(evid(I))}${I.src.length?" · 来自 "+I.src.map(n=>esc(SRC[n].p+" · "+SRC[n].n)).join("、"):""}</p>
    <div class="nav2">${prev?`<button data-go="${S.id}--${B.id}--${prev.id}">‹ ${esc(prev.t)}</button>`:""}${next?`<button class="nx" data-go="${S.id}--${B.id}--${next.id}">${esc(next.t)} ›</button>`:""}</div></div>`}

document.addEventListener("click",e=>{const g=e.target.closest("[data-go]"); if(g) go(...g.dataset.go.split("--"))});
document.getElementById("home").onclick=()=>{location.hash=""};
document.getElementById("p-info").onclick=()=>{location.hash=location.hash==="#info"?"":"info"};
addEventListener("hashchange",render);
let rt; addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(render,120)});
render();
</script>

</body></html>
